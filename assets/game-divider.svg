<svg width="1200" height="180" viewBox="0 0 1200 180"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#020617"/>
<stop offset="50%" stop-color="#071126"/>
<stop offset="100%" stop-color="#02030A"/>

</linearGradient>

<linearGradient id="neon"
x1="0%" y1="0%"
x2="100%" y2="0%">

<stop offset="0%" stop-color="#00F7FF"/>
<stop offset="50%" stop-color="#7B2CFF"/>
<stop offset="100%" stop-color="#00F7FF"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="4"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

<pattern id="grid"
width="40"
height="40"
patternUnits="userSpaceOnUse">

<path
d="M40 0 L0 0 0 40"
fill="none"
stroke="#00F7FF"
stroke-width="0.5"
opacity="0.12"/>

</pattern>

</defs>


<!-- Background -->

<rect
width="1200"
height="180"
fill="url(#bg)"/>

<rect
width="1200"
height="180"
fill="url(#grid)"/>


<!-- Decorative lines -->

<path
d="M0 145
C180 95 280 165 450 115
S750 60 1200 120"

fill="none"
stroke="url(#neon)"
stroke-width="2"
filter="url(#glow)"/>

<path
d="M0 155
C180 110 320 170 500 125
S820 75 1200 130"

fill="none"
stroke="#00F7FF"
stroke-width="0.7"
opacity="0.45"/>


<!-- Main title -->

<text
x="600"
y="72"
text-anchor="middle"
font-family="monospace"
font-size="34"
font-weight="bold"
fill="white"
letter-spacing="7">

GAME DEVELOPMENT

</text>


<!-- Subtitle -->

<text
x="600"
y="103"
text-anchor="middle"
font-family="monospace"
font-size="12"
fill="#00F7FF"
letter-spacing="4">

3D  •  ANIMATION  •  AI  •  GAMEPLAY  •  CINEMATICS

</text>


<!-- Side HUD -->

<g
font-family="monospace"
font-size="10"
fill="#64748B"
letter-spacing="2">

<text x="55" y="35">
SYSTEM // GAME_ENGINE
</text>

<text x="950" y="35">
GODOT // 3D
</text>

</g>


<!-- Corner brackets -->

<g
stroke="#00F7FF"
stroke-width="2"
fill="none"
opacity="0.8">

<path d="M30 30 H75"/>
<path d="M30 30 V75"/>

<path d="M1170 30 H1125"/>
<path d="M1170 30 V75"/>

<path d="M30 150 H75"/>
<path d="M30 150 V105"/>

<path d="M1170 150 H1125"/>
<path d="M1170 150 V105"/>

</g>


<!-- Animated scan line -->

<rect
x="50"
y="25"
width="1100"
height="2"
fill="url(#neon)"
opacity="0.8">

<animate
attributeName="y"
from="25"
to="155"
dur="3.5s"
repeatCount="indefinite"/>

</rect>


<!-- Small particles -->

<g fill="#00F7FF">

<circle cx="130" cy="120" r="1.5">
<animate
attributeName="opacity"
values="0.2;1;0.2"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="90" r="1.5">
<animate
attributeName="opacity"
values="1;0.2;1"
dur="2.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="250" cy="50" r="1">
<animate
attributeName="opacity"
values="0.1;1;0.1"
dur="1.8s"
repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="145" r="1">
<animate
attributeName="opacity"
values="1;0.1;1"
dur="2.2s"
repeatCount="indefinite"/>
</circle>

</g>

</svg>
