<svg width="1200" height="360" viewBox="0 0 1200 360"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Background -->
<linearGradient id="background"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#02030A"/>
<stop offset="45%" stop-color="#071126"/>
<stop offset="100%" stop-color="#02030A"/>

</linearGradient>

<!-- Neon -->
<linearGradient id="neon"
x1="0%" y1="0%"
x2="100%" y2="0%">

<stop offset="0%" stop-color="#00F7FF"/>
<stop offset="45%" stop-color="#7B2CFF"/>
<stop offset="100%" stop-color="#00F7FF"/>

</linearGradient>

<!-- Glow -->
<filter id="glow">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="smallGlow">
<feGaussianBlur stdDeviation="2" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<!-- Grid -->
<pattern id="grid"
width="50"
height="50"
patternUnits="userSpaceOnUse">

<path
d="M 50 0 L 0 0 0 50"
fill="none"
stroke="#00F7FF"
stroke-width="0.5"
opacity="0.13"/>

</pattern>

<!-- Scan -->
<linearGradient id="scan"
x1="0%" y1="0%"
x2="100%" y2="0%">

<stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
<stop offset="50%" stop-color="#00F7FF" stop-opacity="0.8"/>
<stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>

</linearGradient>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
width="1200"
height="360"
fill="url(#background)"/>

<rect
width="1200"
height="360"
fill="url(#grid)"/>


<!-- ================================================= -->
<!-- AMBIENT LIGHT -->
<!-- ================================================= -->

<ellipse
cx="150"
cy="100"
rx="180"
ry="100"
fill="#00F7FF"
opacity="0.035"/>

<ellipse
cx="1050"
cy="250"
rx="250"
ry="140"
fill="#7B2CFF"
opacity="0.035"/>


<!-- ================================================= -->
<!-- PARTICLES -->
<!-- ================================================= -->

<g fill="#00F7FF" opacity="0.7">

<circle cx="105" cy="78" r="1.5"/>
<circle cx="190" cy="240" r="1"/>
<circle cx="280" cy="65" r="1.5"/>
<circle cx="410" cy="285" r="1"/>
<circle cx="520" cy="45" r="1"/>
<circle cx="690" cy="290" r="1.5"/>
<circle cx="780" cy="55" r="1"/>
<circle cx="910" cy="105" r="1.5"/>
<circle cx="1010" cy="290" r="1"/>
<circle cx="1120" cy="75" r="1.5"/>

</g>


<!-- ================================================= -->
<!-- FUTURISTIC TOP HUD -->
<!-- ================================================= -->

<g
font-family="monospace"
font-size="11"
fill="#64748B"
letter-spacing="2">

<text x="55" y="38">SYSTEM // ONLINE</text>

<text x="1020" y="38">IMRANNRO // 2026</text>

</g>


<!-- ================================================= -->
<!-- CORNER HUD -->
<!-- ================================================= -->

<g
stroke="#00F7FF"
stroke-width="2"
fill="none"
opacity="0.8">

<!-- Top Left -->
<path d="M35 35 H90"/>
<path d="M35 35 V90"/>

<!-- Top Right -->
<path d="M1165 35 H1110"/>
<path d="M1165 35 V90"/>

<!-- Bottom Left -->
<path d="M35 325 H90"/>
<path d="M35 325 V270"/>

<!-- Bottom Right -->
<path d="M1165 325 H1110"/>
<path d="M1165 325 V270"/>

</g>


<!-- ================================================= -->
<!-- CENTRAL FRAME -->
<!-- ================================================= -->

<rect
x="115"
y="70"
width="970"
height="220"
rx="4"
fill="#020617"
fill-opacity="0.38"
stroke="url(#neon)"
stroke-width="1"
opacity="0.85"/>


<!-- ================================================= -->
<!-- CENTRAL GLOW LINE -->
<!-- ================================================= -->

<path
d="M150 260
C300 205 350 280 510 220
S790 135 1050 210"

fill="none"
stroke="url(#neon)"
stroke-width="2"
filter="url(#glow)"/>

<path
d="M150 270
C320 220 390 285 540 235
S800 155 1050 220"

fill="none"
stroke="#00F7FF"
stroke-width="0.7"
opacity="0.5"/>


<!-- ================================================= -->
<!-- IDENTITY -->
<!-- ================================================= -->

<text
x="600"
y="145"
text-anchor="middle"
font-family="monospace"
font-size="58"
font-weight="bold"
fill="white"
letter-spacing="9"
filter="url(#smallGlow)">

MUHAMAD IMRAN

</text>


<text
x="600"
y="180"
text-anchor="middle"
font-family="monospace"
font-size="16"
fill="#00F7FF"
letter-spacing="5">

SOFTWARE ENGINEER

</text>


<text
x="600"
y="210"
text-anchor="middle"
font-family="monospace"
font-size="11"
fill="#94A3B8"
letter-spacing="3">

DEVOPS  //  WEB  //  GAME DEVELOPMENT  //  AUTOMATION

</text>


<!-- ================================================= -->
<!-- STATUS BAR -->
<!-- ================================================= -->

<g font-family="monospace"
font-size="10"
letter-spacing="2">

<text x="155" y="110" fill="#00F7FF">
[ ENGINEERING MODE ]
</text>

<text x="870" y="110" fill="#7B2CFF">
[ BUILD // DEPLOY ]
</text>

</g>


<!-- ================================================= -->
<!-- SCAN LINE -->
<!-- ================================================= -->

<rect
x="120"
y="75"
width="960"
height="2"
fill="url(#scan)"
opacity="0.8">

<animate
attributeName="y"
from="75"
to="288"
dur="4s"
repeatCount="indefinite"/>

</rect>


<!-- ================================================= -->
<!-- ORBIT HUD -->
<!-- ================================================= -->

<g
fill="none"
stroke="#00F7FF"
opacity="0.35">

<ellipse
cx="600"
cy="180"
rx="360"
ry="115"/>

<ellipse
cx="600"
cy="180"
rx="330"
ry="95"/>

</g>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<text
x="600"
y="315"
text-anchor="middle"
font-family="monospace"
font-size="12"
fill="#64748B"
letter-spacing="4">

BUILD  •  AUTOMATE  •  DEPLOY  •  EVOLVE

</text>

</svg>
